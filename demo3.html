<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <main>
        <form action="/preferences" method="post">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" minlength="2" maxlength="60" required>

            <label for="email">email</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">phone number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="enter a 10 digit number">

            <label for="dob">date for birth</label>
            <input type="date" id="dob" name="dob" required>
            
            <label for="course">preferred course</label>
            <select name="course" id="course" required>
                <option value="">choose a course</option>
                <option value="html">html&map; css</option>
                <option value="js">javascript</option>
                <option value="frontend">frontend developer</option>
            </select>
            <label for="bio">about you</label>
            <textarea name="bio" id="bio" rows="4" maxlength="300" placeholder="tell aboutyourself">
                <label for="resume">resume(pdf)</label>
                <input type="file" id="resume" name="resume" accept="pdf,application/pdf">
                <fieldset>
                    <legend>terms and condition</legend>
                    <label for="terms">
                        <input type="checkbox" id="skill-html" value="html"> html
                        
                    </label>
                </fieldset>
            </textarea>
    



        </form>
    </main>
</body>
</html>
